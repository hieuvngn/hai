name: CD — build, smoke, deploy

# Chỉ chạy khi có tag version (vd v1.2.0) hoặc push manual.
# Flow: build image → boot container → smoke test nội bộ → push registry →
#       (tuỳ chọn) SSH deploy qua self-hosted runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/fashion-chatbot

jobs:
  build-smoke-push:
    name: Build + smoke + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE:latest -t $IMAGE:sha-$GITHUB_SHA .

      - name: Smoke test trong container
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OPENROUTER_API_KEY=smoke-not-used \
            -e ADMIN_TOKEN=smoke-token \
            -e STATIC_DIR=/app/static \
            $IMAGE:latest
          # warmup_or_die với key giả → list_models fail mềm (warning), server vẫn boot
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          BACKEND_URL=http://127.0.0.1:8000 bash scripts/smoke-test.sh
          docker logs smoke
          docker rm -f smoke

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:sha-$GITHUB_SHA

  deploy:
    name: Deploy (self-hosted)
    needs: build-smoke-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, deploy]
    steps:
      - name: Pull + restart trên server
        env:
          IMAGE: ghcr.io/${{ github.repository }}/fashion-chatbot
        run: |
          docker pull $IMAGE:latest
          docker rm -f fashion-chatbot || true
          docker run -d --name fashion-chatbot --restart unless-stopped \
            -p 8000:8000 \
            --env-file /opt/fashion-chatbot/.env \
            -v /opt/fashion-chatbot/data:/app/backend/data \
            $IMAGE:latest
          sleep 10
          curl -sf http://127.0.0.1:8000/api/health
