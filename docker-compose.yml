# One-click chạy production local: docker compose up
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # giữ đơn hàng/giỏ/catalog qua restart container
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
